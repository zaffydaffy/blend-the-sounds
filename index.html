<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blend the Sounds!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { --blue:#208bd5; --blue-dark:#12649c; --ink:#17364d; --yellow:#ffdf65; --green:#27955b; --red:#d94b52; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Fredoka,sans-serif; color:var(--ink); }
    button { font:inherit; cursor:pointer; }
    button:focus-visible { outline:4px solid #123d6a; outline-offset:4px; }
    button:disabled { cursor:default; }
    [hidden] { display:none!important; }
    .world { width:100%; min-height:100vh; background:radial-gradient(circle at 8% 14%,#ffffffa8,transparent 30%),radial-gradient(circle at 90% 85%,#91d9ff,transparent 32%),#dff4ff; }
    .panel { box-shadow:0 20px 55px #236d9b24; }
    .letter { background:var(--blue); color:white; border:4px solid #1477bb; transition:transform .18s,background .18s; }
    .letter:hover { transform:translateY(-3px); }
    .letter.is-playing { background:var(--yellow); color:#3b3007; border-color:#d69a12; transform:translateY(-5px); }
    .choice { border:4px solid #c6e4f7; background:#fff; color:#176ca4; transition:transform .16s,background .16s,border-color .16s; }
    .choice:hover:not(:disabled) { transform:translateY(-4px); border-color:var(--blue); }
    .choice.is-wrong { animation:wrong-flash .75s ease-in-out; }
    .choice.is-right { background:#daf7df; border-color:var(--green); color:#17643a; }
    @keyframes wrong-flash { 0%,100% { background:#fff; border-color:#c6e4f7; } 20%,65% { background:#ffd9db; border-color:var(--red); transform:translateX(3px); } }
    .picture svg { width:clamp(3.8rem,8vw,6rem); height:clamp(3.8rem,8vw,6rem); stroke-width:1.8; }
    .picture .special { width:clamp(3.8rem,8vw,6rem); height:clamp(3.8rem,8vw,6rem); }
    .modal-backdrop { background:#123d6ab8; }
    .primary { background:var(--blue); color:white; }
    .primary:hover { background:var(--blue-dark); }
    .success { background:var(--green); color:white; }
    .success:hover { background:#207849; }
    .danger { background:var(--red); color:white; }
    .danger:hover { background:#b52f38; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body class="w-full">
  <div class="world w-full px-3 py-5 sm:px-8 sm:py-9">
    <div class="mx-auto w-full max-w-5xl">
      <main class="panel w-full rounded-[2rem] border-4 border-white bg-white p-5 sm:p-9">
        <section id="start-screen" class="py-8 text-center sm:py-14" aria-labelledby="start-title">
          <div class="mx-auto mb-5 flex h-24 w-24 items-center justify-center rounded-[2rem] bg-[#ffdf65] text-[#176ca4]" aria-hidden="true"><i data-lucide="audio-lines" class="h-12 w-12"></i></div>
          <h1 id="start-title" class="mx-auto max-w-2xl font-bold leading-tight"></h1>
          <p id="start-subtitle" class="mx-auto mt-4 max-w-xl leading-relaxed"></p>
          <button id="start-button" type="button" class="success mt-9 min-w-48 rounded-2xl px-10 py-4 font-bold shadow-lg"></button>
          <p id="teacher-note" class="mx-auto mt-8 max-w-xl"></p>
        </section>
        <section id="game-screen" aria-labelledby="game-title" hidden>
          <header class="flex flex-wrap items-center justify-between gap-3 border-b-2 border-[#e0f1fb] pb-5">
            <button id="exit-button" type="button" class="danger rounded-xl px-5 py-3 font-semibold"></button>
            <h1 id="game-title" class="text-center font-bold"></h1>
            <div class="rounded-full bg-[#e0f3ff] px-4 py-2 font-semibold text-[#125984]" aria-live="polite"><span id="question-label"></span> <span id="question-count"></span></div>
          </header>
          <div class="pt-6 text-center">
            <p id="listen-instruction" class="font-medium"></p>
            <div class="mx-auto mt-6 grid max-w-2xl grid-cols-3 gap-2 sm:gap-5">
              <div><p id="first-label" class="mb-2 font-semibold"></p><button id="letter-0" type="button" class="letter aspect-square w-full max-w-40 rounded-2xl text-[clamp(3.3rem,10vw,6rem)] font-bold lowercase" aria-label="Hear first consonant"></button></div>
              <div><p id="middle-label" class="mb-2 font-semibold"></p><button id="letter-1" type="button" class="letter aspect-square w-full max-w-40 rounded-2xl text-[clamp(3.3rem,10vw,6rem)] font-bold lowercase" aria-label="Hear vowel"></button></div>
              <div><p id="last-label" class="mb-2 font-semibold"></p><button id="letter-2" type="button" class="letter aspect-square w-full max-w-40 rounded-2xl text-[clamp(3.3rem,10vw,6rem)] font-bold lowercase" aria-label="Hear last consonant"></button></div>
            </div>
            <button id="replay-button" type="button" class="primary mt-6 rounded-2xl px-8 py-4 font-semibold shadow-md"></button>
            <div id="audio-status" class="mt-3 min-h-7 font-medium text-[#376b87]" role="status" aria-live="polite">Ready</div>
          </div>
          <div class="mx-auto my-6 h-0.5 max-w-3xl bg-[#e0f1fb]"></div>
          <h2 id="choose-heading" class="text-center font-bold"></h2>
          <div id="choices" class="mx-auto mt-5 grid max-w-3xl grid-cols-3 gap-2 sm:gap-5" aria-label="Picture choices"></div>
          <p id="feedback" class="min-h-10 pt-4 text-center text-2xl font-bold" role="status" aria-live="assertive"></p>
        </section>
        <section id="result-screen" class="py-9 text-center" aria-labelledby="result-title" hidden>
          <div class="mx-auto flex h-24 w-24 items-center justify-center rounded-full bg-[#ffdf65] text-[#80520b]" aria-hidden="true"><i data-lucide="star" class="h-12 w-12"></i></div>
          <h2 id="result-title" class="mt-6 font-bold"></h2>
          <p id="final-score" class="mt-4 text-[clamp(2rem,6vw,3.5rem)] font-bold text-[#176ca4]" aria-live="polite"></p>
          <button id="again-button" type="button" class="success mt-7 rounded-2xl px-9 py-4 font-bold"></button>
        </section>
      </main>
      <footer class="py-4 text-center"><p id="footer-note"></p></footer>
    </div>
  </div>
  <div id="exit-modal" class="modal-backdrop fixed inset-0 z-20 flex items-center justify-center p-4" hidden>
    <div class="w-full max-w-md rounded-[2rem] bg-white p-7 text-center shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="exit-title">
      <h2 id="exit-title" class="font-bold"></h2>
      <p id="exit-description" class="mt-3"></p>
      <div class="mt-7 flex flex-col gap-3 sm:flex-row"><button id="continue-button" type="button" class="primary flex-1 rounded-xl px-4 py-3 font-semibold"></button><button id="confirm-exit-button" type="button" class="danger flex-1 rounded-xl px-4 py-3 font-semibold"></button></div>
    </div>
  </div>
<script>
'use strict';

const graphemeAudio = {
  b: "audio/graphemes/B Phoneme.m4a",
  f: "audio/graphemes/F Phoneme.m4a",
  d: "audio/graphemes/D Phoneme.m4a",
  g: "audio/graphemes/G Phoneme.m4a",
  h: "audio/graphemes/H Phoneme.m4a",
  j: "audio/graphemes/J Phoneme.m4a",
  l: "audio/graphemes/L Phoneme.m4a",
  m: "audio/graphemes/M Phoneme.m4a",
  n: "audio/graphemes/N Phoneme.m4a",
  p: "audio/graphemes/P Phoneme.m4a",
  q: "audio/graphemes/Q Phoneme.m4a",
  r: "audio/graphemes/R Phoneme.m4a",
  s: "audio/graphemes/S Phoneme.m4a",
  t: "audio/graphemes/T Phoneme.m4a",
  u: "audio/graphemes/U as in UP Phoneme.m4a",
  e: "audio/graphemes/E as in elk Phoneme.m4a",
  o: "audio/graphemes/O as in OX Phoneme.m4a",
  i: "audio/graphemes/I as in ill Phoneme.m4a",
  c: "audio/graphemes/C as in car Phoneme.m4a",
  a: "audio/graphemes/A Phoneme.m4a"
};

const wordAudio = {
  bed: "audio/words/Bed_word.ogg",
  bug: "audio/words/Bug_word.ogg",
  bus: "audio/words/Bus_word.ogg",
  can: "audio/words/Can_word.ogg",
  cap: "audio/words/Cap_word.ogg",
  cat: "audio/words/Cat_word.ogg",
  dig: "audio/words/Dig_word.ogg",
  dog: "audio/words/Dog_word.ogg",
  dot: "audio/words/Dot_word.ogg",
  hat: "audio/words/Hat_word.ogg",
  hen: "audio/words/Hen_word.ogg",
  hug: "audio/words/Hug_word.ogg",
  jam: "audio/words/Jam_word.ogg",
  jet: "audio/words/Jet_word.ogg",
  jug: "audio/words/Jug_word.ogg",
  map: "audio/words/Map_word.ogg",
  mat: "audio/words/Mat_word.ogg",
  mop: "audio/words/Mop_word.ogg",
  nap: "audio/words/Nap_word.ogg",
  net: "audio/words/Net_word.ogg",
  nut: "audio/words/Nut_word.ogg",
  rat: "audio/words/Rat_word.ogg",
  red: "audio/words/Red_word.ogg",
  rug: "audio/words/Rug_word.ogg",
  sad: "audio/words/Sad_word.ogg",
  sit: "audio/words/Sit_word.ogg",
  sun: "audio/words/Sun_word.ogg"
};

const words = [
  "bed", "bug", "bus", "can", "cap", "cat", "dig", "dog", "dot",
  "hat", "hen", "hug", "jam", "jet", "jug", "map", "mat", "mop",
  "nap", "net", "nut", "rat", "red", "rug", "sad", "sit", "sun"
];

const icons = {
  bed: "bed-double", bug: "bug", bus: "bus-front", can: "cylinder",
  cap: "graduation-cap", cat: "cat", dig: "shovel", dog: "dog",
  dot: "circle-dot", hat: "hard-hat", hen: "bird", hug: "heart-handshake",
  jam: "jar", jet: "plane", jug: "bottle", map: "map", mat: "grid-3x3",
  mop: "brush-cleaning", nap: "bed-double", net: "network", nut: "circle",
  rat: "mouse", red: "special-red", rug: "rectangle-horizontal", sad: "frown",
  sit: "armchair", sun: "sun"
};

const $ = id => document.getElementById(id);
const interfaceText = {
  "start-title": "Blend the Sounds!",
  "start-subtitle": "Listen to the sounds, blend them together, and choose the matching picture.",
  "start-button": "Start Game",
  "teacher-note": "Tap each letter to hear its sound. Listen carefully before choosing a picture.",
  "exit-button": "Exit Game",
  "game-title": "Blend the Sounds!",
  "question-label": "Question",
  "listen-instruction": "Listen to the sounds. Blend them to make a word.",
  "first-label": "Consonant",
  "middle-label": "Vowel",
  "last-label": "Consonant",
  "replay-button": "Play Sounds Again",
  "choose-heading": "Which picture matches the word?",
  "result-title": "Great job!",
  "again-button": "Play Again",
  "footer-note": "Phonics practice: CVC words",
  "exit-title": "Leave the game?",
  "exit-description": "Are you sure you want to leave? Your progress will be lost.",
  "continue-button": "Continue Playing",
  "confirm-exit-button": "Exit Game"
};
Object.entries(interfaceText).forEach(([id, text]) => {
  const element = $(id);
  if (element) element.textContent = text;
});

const letterButtons = [0, 1, 2].map(i => $("letter-" + i));
const screens = ["start-screen", "game-screen", "result-screen"];
let session = [], questionIndex = 0, firstTryScore = 0, attempts = 0, locked = false;
let generation = 0, pendingWait = null, activeSource = null, audioContext = null;
const audioBuffers = new Map();

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function showScreen(id) { screens.forEach(name => $(name).hidden = name !== id); }
function status(text) { $("audio-status").textContent = text; }
function cancelPlayback() {
  generation++;
  if (pendingWait) { clearTimeout(pendingWait.timer); pendingWait.resolve(); pendingWait = null; }
  if (activeSource) { try { activeSource.stop(); } catch (_) {} activeSource = null; }
  letterButtons.forEach(button => button.classList.remove("is-playing"));
}
function pause(ms, token) {
  return new Promise(resolve => {
    if (token !== generation) { resolve(); return; }
    const timer = setTimeout(() => { pendingWait = null; resolve(); }, ms);
    pendingWait = { timer, resolve };
  });
}
async function getBuffer(path) {
  if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();
  if (!audioBuffers.has(path)) {
    const response = await fetch(path);
    if (!response.ok) throw new Error("Recording could not load: " + path);
    audioBuffers.set(path, await audioContext.decodeAudioData(await response.arrayBuffer()));
  }
  return audioBuffers.get(path);
}
async function playRecording(path, token) {
  if (!path) { await pause(550, token); return; }
  try {
    const buffer = await getBuffer(path);
    if (token !== generation) return;
    await new Promise(resolve => {
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      activeSource = source;
      source.onended = () => {
        if (activeSource === source) activeSource = null;
        resolve();
      };
      source.start();
    });
  } catch (error) {
    console.error("Audio playback error:", error);
    if (token === generation) {
      status("Recording unavailable. You can still choose a picture.");
      await pause(550, token);
    }
  }
}
async function playLetter(index, token) {
  if (token !== generation) return;
  const letter = session[questionIndex][index];
  letterButtons[index].classList.add("is-playing");
  status(graphemeAudio[letter] ? "Playing sound..." : "Sound not added yet — showing the letter.");
  try { await playRecording(graphemeAudio[letter], token); }
  finally { letterButtons[index].classList.remove("is-playing"); }
}
async function playSequence() {
  if (locked || !$("exit-modal").hidden || !session.length) return;
  cancelPlayback();
  const token = generation;
  for (let i = 0; i < 3; i++) {
    if (token !== generation) return;
    await playLetter(i, token);
    if (token !== generation) return;
    if (i < 2) { status("Waiting 2.5 seconds..."); await pause(2500, token); }
  }
  if (token === generation) status("Ready");
}
async function playSingle(index) {
  if (locked || !$("exit-modal").hidden) return;
  cancelPlayback();
  const token = generation;
  await playLetter(index, token);
  if (token === generation) status("Ready");
}
function pictureMarkup(word) {
  if (word === "red") return '<svg class="special" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="#e34f56" stroke="#ad2531" stroke-width="5"/></svg>';
  return '<i data-lucide="' + (icons[word] || "circle-help") + '" aria-hidden="true"></i>';
}
function drawQuestion() {
  cancelPlayback();
  locked = false;
  attempts = 0;
  const word = session[questionIndex];
  $("question-count").textContent = `${questionIndex + 1} / 10`;
  $("feedback").textContent = "";
  letterButtons.forEach((button, i) => { button.textContent = word[i]; button.disabled = false; });
  $("replay-button").disabled = false;
  const options = shuffle([word, ...shuffle(words.filter(item => item !== word)).slice(0, 2)]);
  const list = $("choices");
  list.replaceChildren();
  options.forEach(option => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice picture flex min-h-32 items-center justify-center rounded-2xl p-3 sm:min-h-44";
    button.setAttribute("aria-label", `Picture of ${option}`);
    button.innerHTML = pictureMarkup(option);
    button.addEventListener("click", () => selectChoice(option, button));
    list.appendChild(button);
  });
  if (window.lucide) window.lucide.createIcons();
  playSequence();
}
async function selectChoice(choice, button) {
  if (locked || !$("exit-modal").hidden) return;
  if (choice !== session[questionIndex]) {
    attempts++;
    button.classList.remove("is-wrong");
    void button.offsetWidth;
    button.classList.add("is-wrong");
    $("feedback").style.color = "#b52f38";
    $("feedback").textContent = "Try again!";
    return;
  }
  locked = true;
  cancelPlayback();
  button.classList.add("is-right");
  [...$("choices").children].forEach(item => item.disabled = true);
  letterButtons.forEach(item => item.disabled = true);
  $("replay-button").disabled = true;
  if (attempts === 0) firstTryScore++;
  $("feedback").style.color = "#207849";
  $("feedback").textContent = "Correct! Well done!";
  const token = generation;
  const path = wordAudio[session[questionIndex]];
  if (path) { status("Playing word..."); await playRecording(path, token); }
  if (token !== generation) return;
  await pause(1250, token);
  if (token !== generation) return;
  questionIndex++;
  if (questionIndex === 10) {
    $("final-score").textContent = `${firstTryScore} / 10 correct on your first try!`;
    showScreen("result-screen");
  } else drawQuestion();
}
function startGame() {
  cancelPlayback();
  session = shuffle(words).slice(0, 10);
  questionIndex = 0;
  firstTryScore = 0;
  showScreen("game-screen");
  drawQuestion();
}
function closeModal() { $("exit-modal").hidden = true; $("exit-button").focus(); }

$("start-button").addEventListener("click", startGame);
$("again-button").addEventListener("click", startGame);
$("replay-button").addEventListener("click", playSequence);
letterButtons.forEach((button, i) => button.addEventListener("click", () => playSingle(i)));
$("exit-button").addEventListener("click", () => {
  cancelPlayback();
  status("Paused");
  $("exit-modal").hidden = false;
  $("continue-button").focus();
});
$("continue-button").addEventListener("click", closeModal);
$("confirm-exit-button").addEventListener("click", () => {
  cancelPlayback();
  $("exit-modal").hidden = true;
  showScreen("start-screen");
  $("start-button").focus();
});
$("exit-modal").addEventListener("keydown", event => {
  if (event.key === "Escape") { event.preventDefault(); closeModal(); }
  if (event.key === "Tab") {
    const first = $("continue-button"), last = $("confirm-exit-button");
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});
if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
